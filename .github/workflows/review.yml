name: AI code review
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install .
      # Restore the memory DB so the agent keeps learning between PRs
      - uses: actions/cache@v4
        with:
          path: .reviewer/memory.db
          key: reviewer-memory-${{ github.run_id }}
          restore-keys: reviewer-memory-
      - name: Review PR
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: reviewer review --repo ${{ github.repository }} --pr ${{ github.event.pull_request.number }} --post
